name: Smoke Test (GPU Runner)

on:
  pull_request:
    branches:
      - main

env:
  BENCH_SUITE_URL: "https://boundless-benchmarks.mintybasil.dev/suites/suite-og-testing-1-1m.tar.zst"

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: shellcheck scripts/*.sh entrypoint.sh

      - name: Run init-artifacts tests
        run: bash tests/test-init-artifacts.sh

      - name: Run log-specs tests
        run: bash tests/test_log_specs.sh

  smoke-test:
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 30
    needs: shell-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        run: |
          docker build -t bento-bench-smoke-test .

      - name: Run smoke test
        run: |
          # Run with internal testing suite
          # timeout 1200s = 20 minutes (artifact download + services + agents startup + bench)
          timeout 1200s docker run --rm \
            --gpus all \
            -e BENCH_SUITE=${{ env.BENCH_SUITE_URL }} \
            -e RUST_BACKTRACE=1 \
            -e SEGMENT_SIZE=17 \
            bento-bench-smoke-test | tee smoke_test.log

      - name: Verify results
        run: |
          # Check if the log contains "Prove KHz"
          if grep -q "Prove KHz" smoke_test.log; then
            echo "Success: Benchmark table output found."
          else
            echo "Error: Benchmark table output not found in logs."
            exit 1
          fi
