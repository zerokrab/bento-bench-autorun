name: Smoke Test (GPU Runner)

on:
  pull_request:
    branches:
      - main

jobs:
  smoke-test:
    runs-on: [self-hosted, linux, x64, gpu]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -t bento-bench-smoke-test .

      - name: Run smoke test
        run: |
          # Run with order-generator-tiny suite
          # timeout 900s = 15 minutes (services + artifacts + bench)
          timeout 900s docker run --rm \
            --gpus all \
            -e BENTO_BENCH_SUITE=order-generator-tiny \
            -e BENTO_BENCH_CYCLES=1000000 \
            bento-bench-smoke-test | tee smoke_test.log

      - name: Verify results
        run: |
          # Check if the log contains "Prove KHz"
          if grep -q "Prove KHz" smoke_test.log; then
            echo "Success: Benchmark table output found."
          else
            echo "Error: Benchmark table output not found in logs."
            exit 1
          fi